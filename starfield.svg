<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
<style>

circle {
  --i: sibling-index();
  --angle: calc(var(--i) * 137.508deg);
  --dist: calc(280px + mod(var(--i) * 97, 320) * 1px);
  r: calc(0.4px + mod(var(--i) * 0.618, 1) * 1.4px);
  fill: #ffffff;
  opacity: 0;
  animation: fly linear infinite;
  animation-duration: calc(2s + mod(var(--i) * 0.73, 4) * 1s);
  animation-delay: calc(mod(var(--i) * 1.37, 7) * -1s);
}

@media (prefers-color-scheme: light) {
  circle { fill: #1b1f24; }
}

@keyframes fly {
  0% {
    transform: translate(400.0px, 200.0px) rotate(var(--angle)) translateX(0px) scale(0.1);
    opacity: 0;
  }
  10% { opacity: 0.3; }
  50% { opacity: 0.8; }
  85% { opacity: 1; }
  100% {
    transform: translate(400.0px, 200.0px) rotate(var(--angle)) translateX(var(--dist)) scale(1);
    opacity: 0;
  }
}

</style>
